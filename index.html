<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolução Corporal</title>
<meta name="theme-color" content="#0E4A5C">
<meta name="description" content="Acompanhe a evolução dos seus indicadores de bioimpedância.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evolução">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #F4F7F9;
    --card: #FFFFFF;
    --ink: #12303A;
    --muted: #5E7480;
    --line: #DCE5EA;
    --input: #EEF3F6;
    --good: #CBE7FA;
    --good-ink: #0B4A6F;
    --bad: #F8D3D3;
    --bad-ink: #7A1F1F;
    --brand: #0E4A5C;
    --brand-ink: #FFFFFF;
    --chart: #1B5E7B;
    --focus: #1B8FBF;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1A20;
      --card: #16262E;
      --ink: #E6EFF3;
      --muted: #8FA7B3;
      --line: #25404B;
      --input: #1D313B;
      --good: #1D4B66;
      --good-ink: #BFE3F8;
      --bad: #6A2A2A;
      --bad-ink: #F6CFCF;
      --brand: #3AA7C9;
      --brand-ink: #06222C;
      --chart: #62BBDB;
      --focus: #62BBDB;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    font-size: 16px;
    line-height: 1.4;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }

  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 1.6rem; line-height: 1.1; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
  header.top p { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }

  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .btn-primary {
    background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 10px;
    padding: 11px 18px; font-weight: 600;
  }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost {
    background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; font-size: 0.92rem;
  }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

  /* ---------- Tabela ---------- */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { padding: 0; border-bottom: 1px solid var(--line); text-align: center; }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
  thead th { padding: 8px 2px 6px; min-width: 56px; width: 56px; font-weight: 600; vertical-align: bottom; }
  th.kpi {
    position: sticky; left: 0; z-index: 2; background: var(--card);
    text-align: left; padding: 10px 12px; min-width: 128px; max-width: 128px;
    font-weight: 600; font-size: 0.93rem; border-right: 1px solid var(--line);
  }
  thead th.kpi { z-index: 3; color: var(--muted); font-weight: 600; }
  .datebox { position: relative; display: block; margin: 0 auto; width: 52px; }
  .datebox span {
    display: block; font-size: 0.72rem; color: var(--muted); background: var(--input);
    border-radius: 6px; padding: 5px 0; text-align: center; font-weight: 500; font-variant-numeric: tabular-nums;
  }
  .datebox input[type="date"] {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px;
  }
  .del {
    display: block; margin: 2px auto 0; border: 0; background: transparent; color: var(--muted);
    font-size: 1rem; line-height: 1; width: 24px; height: 22px; border-radius: 50%;
  }
  .del:hover { background: var(--input); color: var(--ink); }
  td.c { background: var(--input); transition: background .2s; }
  td.c.good { background: var(--good); }
  td.c.bad { background: var(--bad); }
  td.c.good input { color: var(--good-ink); }
  td.c.bad input { color: var(--bad-ink); }
  input.cell {
    width: 100%; border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 0.98rem; font-weight: 600; text-align: center;
    padding: 13px 2px; font-variant-numeric: tabular-nums; min-width: 0;
  }
  input.cell::placeholder { color: var(--muted); opacity: .45; font-weight: 400; }
  td.c { border-left: 2px solid var(--card); width: 56px; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 4px 0; font-size: 0.85rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 1px solid var(--line); }
  .sw.good { background: var(--good); } .sw.bad { background: var(--bad); } .sw.neutral { background: var(--input); }

  /* ---------- Gráficos ---------- */
  h2 { font-size: 1.15rem; margin: 32px 4px 12px; letter-spacing: -0.01em; }
  .charts { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .chart { padding: 14px 14px 8px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .chart-head h3 { margin: 0; font-size: 0.98rem; font-weight: 600; }
  .chip { font-size: 0.8rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--input); color: var(--muted); white-space: nowrap; }
  .chip.good { background: var(--good); color: var(--good-ink); }
  .chip.bad { background: var(--bad); color: var(--bad-ink); }
  .chart svg { width: 100%; height: auto; display: block; margin-top: 6px; }
  .chart .note { color: var(--muted); font-size: 0.82rem; margin: 2px 0 6px; }
  svg text { font-family: inherit; fill: var(--muted); font-size: 11px; }
  svg text.val { fill: var(--ink); font-weight: 600; font-size: 12px; }

  footer { margin-top: 36px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 0.85rem; }
  footer p { margin: 0; flex-basis: 100%; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Evolução corporal</h1>
      <p>Seus números da bioimpedância, medição a medição.</p>
    </div>
    <button class="btn-primary" id="add">+ Nova medição</button>
  </header>

  <div class="card">
    <div class="table-scroll" id="scroll">
      <table id="tabela"></table>
    </div>
  </div>
  <div class="legend">
    <span><i class="sw good"></i>melhorou vs. medição anterior</span>
    <span><i class="sw bad"></i>piorou</span>
    <span><i class="sw neutral"></i>primeira medição ou sem mudança</span>
  </div>

  <h2>Gráfico evolutivo</h2>
  <div class="charts" id="graficos"></div>

  <footer>
    <button class="btn-ghost" id="exportar">Salvar backup</button>
    <button class="btn-ghost" id="importar">Restaurar backup</button>
    <input type="file" id="arquivo" accept="application/json,.json" class="hidden">
    <p>Os dados ficam guardados só neste aparelho. Salve um backup de vez em quando.</p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Indicadores ---------- */
  var KPIS = [
    { id: 'peso',     nome: 'Peso (kg)',              melhor: 'down' },
    { id: 'imc',      nome: 'IMC',                    melhor: 'down' },
    { id: 'gordura',  nome: 'Gordura (%)',            melhor: 'down' },
    { id: 'musculo',  nome: 'Músculo (%)',            melhor: 'up'   },
    { id: 'visceral', nome: 'Gordura visceral',       melhor: 'down' },
    { id: 'tmb',      nome: 'Taxa metabólica (kcal)', melhor: 'up'   },
    { id: 'idade',    nome: 'Idade do corpo (anos)',  melhor: 'down' }
  ];

  /* ---------- Armazenamento (com reserva em memória) ---------- */
  var KEY = 'evolucao-corporal-v1';
  var memoria = null;
  function carregar() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); if (d && Array.isArray(d.medicoes)) return d; }
    } catch (e) { if (memoria) return memoria; }
    return memoria || null;
  }
  function salvar() {
    memoria = estado;
    try { window.localStorage.setItem(KEY, JSON.stringify(estado)); } catch (e) {}
  }

  function hoje() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var dia = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + dia;
  }
  function novoId() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function novaMedicao() { return { id: novoId(), data: hoje(), v: {} }; }

  var estado = carregar() || { medicoes: [novaMedicao()] };
  if (!estado.medicoes.length) estado.medicoes.push(novaMedicao());

  function ordenadas() {
    return estado.medicoes.slice().sort(function (a, b) {
      return a.data === b.data ? 0 : (a.data < b.data ? -1 : 1);
    });
  }
  function rotuloT(i) { return i === 0 ? 'T0' : 'T+' + i; }
  function num(s) {
    if (s === undefined || s === null || String(s).trim() === '') return null;
    var n = parseFloat(String(s).replace(',', '.'));
    return isNaN(n) ? null : n;
  }
  function fmt(n) { return n.toLocaleString('pt-BR', { maximumFractionDigits: 1 }); }
  function dataCurta(iso, ano) { var p = iso.split('-'); return p.length === 3 ? p[2] + '/' + p[1] + (ano ? '/' + p[0].slice(2) : '') : iso; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  /* ---------- Tabela ---------- */
  var tabela = document.getElementById('tabela');

  function montarTabela() {
    var ms = ordenadas();
    var h = '<thead><tr><th class="kpi" scope="col">Indicador</th>';
    ms.forEach(function (m, i) {
      h += '<th scope="col"><label class="datebox"><span>' + dataCurta(m.data, true) + '</span>' +
           '<input type="date" data-date="' + m.id + '" value="' + esc(m.data) + '" aria-label="Data da medição ' + (i + 1) + '"></label>' +
           '<button class="del" data-del="' + m.id + '" aria-label="Remover medição de ' + dataCurta(m.data, true) + '" title="Remover">×</button></th>';
    });
    h += '</tr></thead><tbody>';
    KPIS.forEach(function (k) {
      h += '<tr><th class="kpi" scope="row">' + k.nome + '</th>';
      ms.forEach(function (m, i) {
        var v = m.v[k.id];
        h += '<td class="c" data-td="' + m.id + '|' + k.id + '"><input class="cell" inputmode="decimal" autocomplete="off" placeholder="–" ' +
             'data-m="' + m.id + '" data-k="' + k.id + '" value="' + esc(v === undefined ? '' : v) + '" ' +
             'aria-label="' + k.nome + ' em ' + dataCurta(m.data, true) + '"></td>';
      });
      h += '</tr>';
    });
    h += '</tbody>';
    tabela.innerHTML = h;
    colorir();
  }

  // Compara cada valor com o último valor preenchido antes dele.
  function colorir() {
    var ms = ordenadas();
    KPIS.forEach(function (k) {
      var anterior = null;
      ms.forEach(function (m) {
        var td = tabela.querySelector('[data-td="' + m.id + '|' + k.id + '"]');
        if (!td) return;
        var atual = num(m.v[k.id]);
        td.classList.remove('good', 'bad');
        if (atual !== null) {
          if (anterior !== null && atual !== anterior) {
            var melhorou = k.melhor === 'down' ? atual < anterior : atual > anterior;
            td.classList.add(melhorou ? 'good' : 'bad');
          }
          anterior = atual;
        }
      });
    });
  }

  tabela.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.classList.contains('cell')) return;
    var m = estado.medicoes.filter(function (x) { return x.id === t.dataset.m; })[0];
    if (!m) return;
    m.v[t.dataset.k] = t.value;
    salvar(); colorir(); desenharGraficos();
  });

  tabela.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.date) {
      var m = estado.medicoes.filter(function (x) { return x.id === t.dataset.date; })[0];
      if (m && t.value) { m.data = t.value; salvar(); montarTabela(); desenharGraficos(); }
    }
  });

  tabela.addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]');
    if (!b) return;
    var id = b.dataset.del;
    if (estado.medicoes.length === 1) {
      if (confirm('Limpar os valores desta medição?')) {
        estado.medicoes[0].v = {};
        salvar(); montarTabela(); desenharGraficos();
      }
      return;
    }
    if (confirm('Remover esta medição? Os valores dela serão apagados.')) {
      estado.medicoes = estado.medicoes.filter(function (x) { return x.id !== id; });
      salvar(); montarTabela(); desenharGraficos();
    }
  });

  document.getElementById('add').addEventListener('click', function () {
    var m = novaMedicao();
    estado.medicoes.push(m);
    salvar(); montarTabela(); desenharGraficos();
    var sc = document.getElementById('scroll');
    var campo = tabela.querySelector('input.cell[data-m="' + m.id + '"]');
    if (campo) {
      campo.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
      campo.focus({ preventScroll: true });
    }
  });

  /* ---------- Gráficos ---------- */
  var gr = document.getElementById('graficos');
  var W = 340, H = 170, PL = 18, PR = 18, PT = 26, PB = 28;

  function desenharGraficos() {
    var ms = ordenadas();
    gr.innerHTML = KPIS.map(function (k) {
      var pts = [];
      ms.forEach(function (m, i) {
        var n = num(m.v[k.id]);
        if (n !== null) pts.push({ x: i, n: n, data: m.data, t: rotuloT(i) });
      });
      return '<div class="card chart"><div class="chart-head"><h3>' + k.nome + '</h3>' + chip(k, pts) + '</div>' +
             (pts.length === 0
               ? '<p class="note">Sem dados ainda. Preencha a tabela acima.</p>'
               : pts.length === 1
                 ? '<p class="note">Adicione mais uma medição para ver a evolução.</p>'
                 : '') +
             (pts.length ? svg(k, pts, ms.length) : '') + '</div>';
    }).join('');
  }

  function chip(k, pts) {
    if (pts.length < 2) return '<span class="chip">–</span>';
    var d = pts[pts.length - 1].n - pts[0].n;
    if (Math.abs(d) < 1e-9) return '<span class="chip">sem mudança</span>';
    var melhorou = k.melhor === 'down' ? d < 0 : d > 0;
    var sinal = d > 0 ? '+' : '−';
    return '<span class="chip ' + (melhorou ? 'good' : 'bad') + '">' + sinal + fmt(Math.abs(d)) + ' desde ' + pts[0].t + '</span>';
  }

  function svg(k, pts, totalCols) {
    var vals = pts.map(function (p) { return p.n; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (max - min < 1e-9) { min -= 1; max += 1; }
    var pad = (max - min) * 0.15; min -= pad; max += pad;
    var n = pts.length;
    function X(i) { return n === 1 ? W / 2 : PL + (W - PL - PR) * i / (n - 1); }
    function Y(v) { return PT + (H - PT - PB) * (1 - (v - min) / (max - min)); }

    var linha = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.n).toFixed(1); }).join(' ');
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolução de ' + k.nome + '">';
    // linhas-guia
    [0, 0.5, 1].forEach(function (f) {
      var y = PT + (H - PT - PB) * f;
      s += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>';
    });
    if (n > 1) s += '<path d="' + linha + '" fill="none" stroke="var(--chart)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    var passo = n > 8 ? Math.ceil(n / 6) : 1;
    pts.forEach(function (p, i) {
      var ultimo = i === n - 1;
      s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.n).toFixed(1) + '" r="' + (ultimo ? 5 : 3.5) + '" fill="' + (ultimo ? 'var(--chart)' : 'var(--card)') + '" stroke="var(--chart)" stroke-width="2"/>';
      if (i % passo === 0 || ultimo) {
        s += '<text class="val" x="' + X(i).toFixed(1) + '" y="' + (Y(p.n) - 10).toFixed(1) + '" text-anchor="middle">' + fmt(p.n) + '</text>';
        s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + dataCurta(p.data) + '</text>';
      }
    });
    return s + '</svg>';
  }

  /* ---------- Backup ---------- */
  document.getElementById('exportar').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(estado, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'evolucao-corporal-' + hoje() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  var arquivo = document.getElementById('arquivo');
  document.getElementById('importar').addEventListener('click', function () { arquivo.click(); });
  arquivo.addEventListener('change', function () {
    var f = arquivo.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.medicoes)) throw new Error('formato');
        if (!confirm('Isso substitui os dados atuais pelos do backup. Continuar?')) return;
        estado = d;
        if (!estado.medicoes.length) estado.medicoes.push(novaMedicao());
        salvar(); montarTabela(); desenharGraficos();
      } catch (err) { alert('Arquivo inválido. Escolha um backup salvo por este app.'); }
      arquivo.value = '';
    };
    r.readAsText(f);
  });

  montarTabela();
  desenharGraficos();

  /* ---------- Modo offline ---------- */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
